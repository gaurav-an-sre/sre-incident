[project]
name = "sre-incident"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "jinja2==3.1.5",
  "pyyaml==6.0.2",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "ruff==0.9.6",
  "types-PyYAML==6.0.12.20241230",
]

[tool.setuptools]
packages = ["checkout_svc", "payments", "tools", "incident_agents"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
